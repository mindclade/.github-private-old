---
name: Nix qualification

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: nix-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix
    uses: mindclade/.github/.github/workflows/reusable-nix-qualification.yml@c386f4846a669ed841c54bc103d566c463fe4869
    with:
      watch-path-regex: '(^|/)(flake\.nix|flake\.lock|[^/]+\.nix)$|^\.github/workflows/.*nix.*\.ya?ml$'
      ci-command: make validate && make lint
      enable-aarch64-linux: true
      enable-aarch64-darwin: true
      reproducibility-targets: .#checks.x86_64-linux.repository
